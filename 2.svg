.body{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} .char{animation:float 4s ease-in-out infinite} @keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.65}90%{opacity:.65}100%{transform:translateY(300px);opacity:0}} .scan{animation:scan 3.2s linear infinite} @keyframes blink{0%,45%,100%{opacity:.2}50%,90%{opacity:.8}} .dot{animation:blink 1.7s infinite}</style>
<defs>
 <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#087ea4"/><stop offset="1" stop-color="#04c6e9"/></linearGradient>
</defs>

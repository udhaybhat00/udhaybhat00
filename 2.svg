 <text x="380" y="43" class="sub" text-anchor="middle" fill="#778087">CYBERSECURITY × AI</text>
 <text x="380" y="86" class="title" text-anchor="middle" font-size="31" fill="#fff">AI SECURITY ENGINEER</text>

name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:        # lets you run it manually too
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate pacman graph
        uses: Platane/snk@v3
        id: pacman-graph
        with:
          github_user_name: udhaybhat00
          outputs: |
            pacman-contribution-graph.svg?palette=github-dark&color_snake=orange&color_dots=0,coral,#ff9d00,coral,#ff5722

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
